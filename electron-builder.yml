appId: com.github.netroforge
productName: Hronomancer
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
asarUnpack:
  - resources/**

win:
  executableName: Hronomancer
  icon: ./build/icon.svg
  target:
    - target: nsis
      arch:
        - x64
    - target: msi
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
msi:
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  oneClick: false
  perMachine: true
  runAfterFinish: false
  shortcutName: ${productName}
  createDesktopShortcut: always
portable:
  artifactName: ${productName}-${version}-${arch}-windows-no-installer.${ext}

mac:
  icon: ./build/icon.svg
  extendInfo:
    - NSMicrophoneUsageDescription: Hronomancer uses microphone levels locally for the optional audio visualizer.
  notarize: false
  target:
    - target: zip
      arch:
        - x64
        - arm64
    - target: dmg
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: ./build/icon.svg
  maintainer: Netroforge
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: snap
      arch:
        - x64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  category: Utility
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
snapcraft:
  base: core22
  artifactName: ${productName}-${version}-${arch}.${ext}
  publish:
    - provider: github
  core22:
    confinement: strict
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
rpm:
  artifactName: ${productName}-${version}-${arch}.${ext}

npmRebuild: false

publish:
  provider: github
