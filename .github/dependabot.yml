version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      typescript:
        patterns:
          - '@types/*'
          - 'typescript'
      vue:
        patterns:
          - 'vue*'
          - '@vue/*'
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - '@typescript-eslint/*'
      electron:
        patterns:
          - 'electron'
          - 'electron-*'
          - '@electron-toolkit/*'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    # Electron majors must pass the native overlay click-through smoke test
    # before being adopted; v43 regressed the X11 input region to full-screen.
    ignore:
      - dependency-name: 'electron'
        update-types:
          - 'version-update:semver-major'
      # Keep build-tool majors aligned with the peer ranges declared by
      # electron-vite and vue-tsc; incompatible Vite 8 / TypeScript 7 bumps
      # previously broke clean installs and type-checking.
      - dependency-name: 'vite'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
