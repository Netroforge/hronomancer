name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v2.0.0)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "A version tag such as v2.0.0 is required." >&2
            exit 1
          fi
          echo "value=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.value }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Validate versions and frontend
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)"
          for version in "$package_version" "$tauri_version" "$cargo_version"; do
            if [[ "$TAG" != "v$version" ]]; then
              echo "Tag $TAG does not match project version $version." >&2
              exit 1
            fi
          done
          npm ci
          npm test
          npm run build
          npm audit --omit=dev

  build:
    needs: validate
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            args: ''
            rust-targets: ''
            apple_signing_identity: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            apple_signing_identity: '-'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
            apple_signing_identity: '-'
          - platform: windows-latest
            args: ''
            rust-targets: ''
            apple_signing_identity: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Linux native dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libdrm-dev \
            libgbm-dev \
            libpipewire-0.3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxcb1-dev \
            libxi-dev \
            libxrandr-dev \
            libxtst-dev \
            patchelf \
            rpm \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign, and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.apple_signing_identity }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.validate.outputs.tag }}
          releaseName: Hronomancer v__VERSION__
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  publish:
    needs:
      - validate
      - build
    runs-on: ubuntu-22.04
    steps:
      - name: Verify updater metadata, add hashes, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*' \
            --skip-existing
          test -s latest.json
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > release.json
          node -e '
            const fs = require("node:fs");
            const metadata = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            const release = JSON.parse(fs.readFileSync("release.json", "utf8"));
            const publicUrls = new Map(
              release.assets.map((asset) => [asset.url, asset.browser_download_url]),
            );
            for (const entry of Object.values(metadata.platforms ?? {})) {
              const publicUrl = publicUrls.get(entry.url);
              if (!publicUrl) {
                throw new Error(`No public download URL for ${entry.url}`);
              }
              entry.url = publicUrl;
            }
            const required = [
              "darwin-aarch64",
              "darwin-x86_64",
              "linux-x86_64",
              "windows-x86_64",
            ];
            for (const platform of required) {
              const entry = metadata.platforms?.[platform];
              if (!entry?.url || !entry?.signature) {
                throw new Error(`latest.json is missing ${platform}`);
              }
              if (!entry.url.includes(`/releases/download/${process.env.TAG}/`)) {
                throw new Error(`latest.json has a non-public URL for ${platform}`);
              }
            }
            fs.writeFileSync("latest.json", `${JSON.stringify(metadata, null, 2)}\n`);
          '
          rm release.json
          find . -maxdepth 1 -type f ! -name 'hashes.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > ../hashes.txt
          cd ..
          sed -i 's| \./| |g' hashes.txt
          cat hashes.txt
          gh release upload "$TAG" hashes.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
