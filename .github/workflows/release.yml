name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v1.2.0)
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Resolve release tag
        id: tag
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_TAG" =~ ^v[0-9] ]]; then
            echo "A version tag such as v1.2.0 is required." >&2
            exit 1
          fi
          echo "value=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"

      - name: Create a single draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.value }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; reusing it."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --generate-notes \
              --title "Hronomancer ${TAG#v}"
          fi

  build-and-publish-linux:
    needs: prepare-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Installing Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          sudo snap install snapcraft --classic
          npm ci
          npm run publish:linux

  build-and-publish-mac:
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Installing Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run publish:mac

  build-and-publish-win:
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Installing Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run publish:win

  hashes:
    needs:
      - prepare-release
      - build-and-publish-linux
      - build-and-publish-mac
      - build-and-publish-win
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets, generate sha256 hashes, upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir assets
          cd assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '*' \
            --skip-existing
          # Exclude any existing hashes file so re-runs don't hash themselves.
          find . -maxdepth 1 -type f ! -name 'hashes.txt' -print0 \
            | sort -z \
            | xargs -0 sha256sum > ../hashes.txt
          cd ..
          sed -i 's| \./| |g' hashes.txt
          cat hashes.txt
          gh release upload "$TAG" hashes.txt \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest
